name: Verify authoritative Privora source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: agent/go.sum
      - name: Go tests
        working-directory: agent
        run: go test ./...
      - name: Rev5 Rev9 Postfix isolation regression
        run: bash scripts/test-7.0-rev5r9-postfix-check-isolation.sh
      - name: PHP syntax
        run: |
          find panel -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Shell syntax
        run: |
          find install scripts release -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Confirm accepted version marker
        run: |
          test "$(cat VERSION)" = "5.0.0-dev.7.0"
          test -f RELEASE-7.0-REV5R9.md
          test -f AUTHORITATIVE-SOURCE.md
